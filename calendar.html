
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UP SATTA KING</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  background:#101010;
  color:#f5d477;
  font-family:Arial,sans-serif;
}
header {
  text-align:center;
  padding:22px 10px;
  background:#191919;
  border-bottom:1px solid #b58b32;
}
h1 { margin:0; font-size:25px; }
.controls {
  display:flex;
  justify-content:center;
  gap:10px;
  padding:18px 8px;
  flex-wrap:wrap;
}
select,button {
  background:#242424;
  color:#f5d477;
  border:1px solid #b58b32;
  border-radius:6px;
  padding:10px;
  font-size:15px;
}
button { cursor:pointer; }
.table-wrap {
  overflow-x:auto;
  margin:10px;
  border:1px solid #b58b32;
}
table {
  border-collapse:collapse;
  min-width:850px;
  width:100%;
}
th,td {
  border:1px solid #705821;
  padding:9px;
  text-align:center;
}
th {
  background:#292216;
  color:#ffd979;
  position:sticky;
  top:0;
}
td { background:#181818; }
.date { font-weight:bold; min-width:65px; }
.entry {
  width:100%;
  min-width:115px;
  min-height:38px;
  padding:7px;
  background:#222;
  color:white;
  border:1px solid #555;
  border-radius:4px;
}
.footer {
  text-align:center;
  padding:20px;
  color:#999;
}
</style>
</head>
<body>

<header>
<h1>UP SATTA KING</h1>
<p>Monthly Event Planner</p>
</header>

<div class="controls">
<button onclick="changeMonth(-1)">❮ Previous</button>
<select id="month"></select>
<select id="year"></select>
<button onclick="changeMonth(1)">Next ❯</button>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Date</th>
<th>Pilibhit Bazar</th>
<th>DISAWAR</th>
<th>FARIDABAD</th>
<th>GHAZIABADN</th>
<th>GALI/th>
</tr>
</thead>
<tbody id="calendar"></tbody>
</table>
</div>

<div class="footer">
Your Personal Entertainment Calendar
</div>

<script>
const months = [
"January","February","March","April",
"May","June","July","August",
"September","October","November","December"
];

const monthSelect = document.getElementById("month");
const yearSelect = document.getElementById("year");
const calendar = document.getElementById("calendar");

months.forEach((m,i) => {
  monthSelect.add(new Option(m,i));
});

for(let y=2026; y<=2030; y++) {
  yearSelect.add(new Option(y,y));
}

const now = new Date();
monthSelect.value = now.getMonth();
yearSelect.value = now.getFullYear() >= 2026 &&
  now.getFullYear() <= 2030 ? now.getFullYear() : 2026;

function storageKey(y,m,d,c) {
  return `event_${y}_${m}_${d}_${c}`;
}

function renderCalendar() {
  const year = Number(yearSelect.value);
  const month = Number(monthSelect.value);
  const totalDays = new Date(year,month+1,0).getDate();

  calendar.innerHTML = "";

  for(let d=1; d<=totalDays; d++) {
    const weekday = new Date(year,month,d)
      .toLocaleDateString("en-IN",{weekday:"short"});

    const tr = document.createElement("tr");

    const dateCell = document.createElement("td");
    dateCell.className = "date";
    dateCell.textContent = `${d} ${weekday}`;
    tr.appendChild(dateCell);

    for(let c=0; c<5; c++) {
      const td = document.createElement("td");
      const input = document.createElement("input");

      input.className = "entry";
      input.placeholder = "Add event...";
      input.value = localStorage.getItem(
        storageKey(year,month,d,c)
      ) || "";

      input.addEventListener("input", () => {
        localStorage.setItem(
          storageKey(year,month,d,c),
          input.value
        );
      });

      td.appendChild(input);
      tr.appendChild(td);
    }

    calendar.appendChild(tr);
  }
}

function changeMonth(direction) {
  let m = Number(monthSelect.value) + direction;
  let y = Number(yearSelect.value);

  if(m < 0) { m=11; y--; }
  if(m > 11) { m=0; y++; }

  if(y < 2026 || y > 2030) return;

  monthSelect.value = m;
  yearSelect.value = y;
  renderCalendar();
}

monthSelect.addEventListener("change",renderCalendar);
yearSelect.addEventListener("change",renderCalendar);

renderCalendar();
</script>

</body>
</html>
